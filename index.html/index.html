<!DOCTYPE html>
    <html>
        <head>
            <title>FlyZ Store</title>
            <style>
                body {
                    background-image: linear-gradient(to right, rgb(16, 1, 16),rgb(30, 0, 29));
                    font-family: sans-serif;
                }
                h1 {
                    position: relative;
                    font-size: 60px;
                    text-align: left center;
                    margin-top: 0px;
                    background-image: linear-gradient(45deg,#160323,#270046);
                    padding: 20px;
                    color: #ffffff;
                    margin-bottom: 500px;
                }
                .store {
                    color: #016fa1;
                }
                button {
                    position: Absolute;
                    right: 16px;
                    top: 16px;
                    z-index: 1;
                    width: 60px;
                    height: 60px;
                    border: none;
                    border-radius: 8px;
                    background-color: #000000;
                    color: #ffffff;
                    font-size: 36px;
                    cursor: pointer;
                }
                h1 img {
                    border: none;
                }
                footer {
                    margin-top: 80px;
                    padding: 24px;
                    background-image: linear-gradient(45deg, #160323, #270046);
                    color: #ffffff;
                    text-align: center;
                }
                footer p {
                    margin: 8px 0;
                }
            </style>
        </head>
        <body>
            <header>
                <h1>
                    <img src="FlyZ Store.png"
                    style="width: 7.5%; height:auto; border-radius: 16px;">
                    <button type="button" aria-label="Buka menu">☰</button>
                    FlyZ <span class="store">Store</span>
                </h1>
            </header>
        </body>
        <footer>
            <p><strong>FlyZ Store</strong></p>
            <p>Terimakasih telah berkunjung</p>
            <p>&copy; 2026 FlyZ Store. Hak cipta dilindungi.</p>
        </footer>
    </html>
