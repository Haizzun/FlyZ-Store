<!DOCTYPE html>
    <html>
        <head>
            <title>FlyZ Store</title>
            <style>
                body {
                    background-image: linear-gradient(to right, rgb(16, 1, 16),rgb(30, 0, 29));
                    font-family: sans-serif;
                }
                h1 {
                    position: relative;
                    font-size: 44px;
                    text-align: center;
                    margin-top: 0px;
                    background-image: linear-gradient(45deg,#160323,#270046);
                    padding: 20px;
                    color: #ffffff;
                    margin-bottom: 500px;
                }
                button {
                    position: fixed;
                    left: 16px;
                    top: 16px;
                    z-index: 1;
                    width: 36px;
                    height: 36px;
                    border: none;
                    border-radius: 8px;
                    background-color: #000000;
                    color: #ffffff;
                    font-size: 24px;
                    cursor: pointer;
                }
                h2 {
                    color: white;
                    margin-bottom: 0px;
                    font-size: 24px;
                }
                img {
                    width: 20%;
                    height: auto;
                    border-radius: 8px;
                    border: 2px black solid;
                }
                h3 {
                    color: white;
                    margin-top: 200px;
                    font-size: 24px;
                }
                p {
                    font-size: 16px;
                    margin-top: 8px;
                    margin-bottom: 0px;
                }
            </style>
        </head>
        <body>
            <header>
                <h1>
                    <button type="button" aria-label="Buka menu">☰</button>
                    FlyZ Store
                </h1>
                <h2 id="Game">Game
                </h2>
                <img src="https://i.pinimg.com/736x/1f/e5/4a/1fe54a5bfe21d1f2b1fd50b7428e9c6e.jpg">
                <img src="https://i.pinimg.com/736x/4a/96/37/4a9637b31f9f9e4f9bb5f65cd2838772.jpg">
                <h3>
                    Top Up
                    <p>
                        Robux
                    </p>
                <img src="https://i.pinimg.com/736x/3f/b5/a2/3fb5a297aca5798076b61419f8852e18.jpg">
                </h3>
            </header>
        </body>
    </html>
