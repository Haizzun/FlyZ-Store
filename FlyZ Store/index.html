<!DOCTYPE html>
    <html>
        <head>
            <title>FlyZ Store</title>
            <style>
                body {
                    background-image: linear-gradient(to right, rgb(16, 1, 16),rgb(30, 0, 29));
                    font-family: sans-serif;
                }
                h1 {
                    position: relative;
                    font-size: 60px;
                    text-align: left center;
                    margin-top: 0px;
                    background-image: linear-gradient(45deg,#160323,#270046);
                    padding: 20px;
                    color: #ffffff;
                    margin-bottom: 500px;
                }
                .store {
                    color: #016fa1;
                }
                button {
                    position: Absolute;
                    right: 16px;
                    top: 16px;
                    z-index: 1;
                    width: 60px;
                    height: 60px;
                    border: none;
                    border-radius: 8px;
                    background-color: #000000;
                    color: #ffffff;
                    font-size: 36px;
                    cursor: pointer;
                }
                h2 {
                    color: white;
                    margin-bottom: 0px;
                    font-size: 36px;
                }
                img {
                    width: 22%;
                    height: auto;
                    border-radius: 8px;
                    border: 2px black solid;
                }
                h3 {
                    color: white;
                    margin-top: 200px;
                    font-size: 36px;
                }
                p {
                    font-size: 24px;
                    margin-top: 8px;
                    margin-bottom: 0px;
                }
                footer {
                    margin-top: 80px;
                    padding: 24px;
                    background-image: linear-gradient(45deg, #160323, #270046);
                    color: #ffffff;
                    text-align: center;
                }
                footer p {
                    margin: 8px 0;
                }
            </style>
        </head>
        <body>
            <header>
                <h1>
                    <img src="FlyZ Store.png"
                    style="width: 5%; height:auto; border-radius: 16px;">
                    <button type="button" aria-label="Buka menu">☰</button>
                    FlyZ <span class="store">Store</span>
                </h1>
                <h2 id="Game">Game
                </h2>
                <img src="https://i.pinimg.com/736x/1f/e5/4a/1fe54a5bfe21d1f2b1fd50b7428e9c6e.jpg">
                <img src="https://i.pinimg.com/736x/4a/96/37/4a9637b31f9f9e4f9bb5f65cd2838772.jpg">
                <h3>
                    Top Up
                    <p>
                        Robux
                    </p>
                <img src="https://i.pinimg.com/736x/3f/b5/a2/3fb5a297aca5798076b61419f8852e18.jpg">
                </h3>
            </header>
        </body>
        <footer>
            <p><strong>FlyZ Store</strong></p>
            <p>Terimakasih telah berkunjung</p>
            <p>&copy; 2026 FlyZ Store. Hak cipta dilindungi.</p>
        </footer>
    </html>
